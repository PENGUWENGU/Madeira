name: Build Madeira IPA
on: [workflow_dispatch] # Allows you to manually click "Build"

jobs:
  build:
    runs-on: macos-14 # Tells GitHub to use a cloud Mac computer
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          brew install llvm ninja cmake

      - name: Run Builder Script
        run: |
          chmod +x ./scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA-Package
          path: dist/Madeira.ipa
