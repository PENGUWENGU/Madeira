name: Build Madeira Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Show environment
        run: |
          set -euxo pipefail

          uname -a
          uname -m

          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: |
          set -euxo pipefail

          brew install \
            cmake \
            ninja \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            nasm \
            python \
            gettext \
            bison \
            flex

      - name: Install LLVM-MinGW
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="20260421"
          NAME="llvm-mingw-${VERSION}-ucrt-macos-universal"

          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          cd "$RUNNER_TEMP/llvm-mingw"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${VERSION}/${NAME}.tar.xz"

          tar -xf llvm-mingw.tar.xz

          TOOLCHAIN="$RUNNER_TEMP/llvm-mingw/$NAME"

          test -x "$TOOLCHAIN/bin/x86_64-w64-mingw32-clang"
          test -x "$TOOLCHAIN/bin/x86_64-w64-mingw32-clang++"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          echo "LLVM_MINGW=$TOOLCHAIN" >> "$GITHUB_ENV"

          "$TOOLCHAIN/bin/x86_64-w64-mingw32-clang" --version

      - name: Verify submodules
        run: |
          set -euxo pipefail

          git submodule status

          test -d FEX
          test -d wine
          test -d research/dxmt

      - name: Find build scripts
        run: |
          set -euxo pipefail

          find build \
            -type f \
            -name build.sh \
            -print \
            | sort

      - name: Make build scripts executable
        run: |
          set -euxo pipefail

          find build \
            -type f \
            -name build.sh \
            -exec chmod +x {} \;

      - name: Build native components
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$LLVM_MINGW/bin:$PATH"

          mapfile -t SCRIPTS < <(
            find build \
              -type f \
              -name build.sh \
              -print \
              | sort
          )

          if [ "${#SCRIPTS[@]}" -eq 0 ]; then
            echo "ERROR: No build scripts found."
            exit 1
          fi

          for script in "${SCRIPTS[@]}"; do
            echo
            echo "=============================================="
            echo "BUILDING: $script"
            echo "=============================================="

            "$GITHUB_WORKSPACE/$script"
          done

      - name: Check generated libraries
        shell: bash
        run: |
          set -euxo pipefail

          REQUIRED=(
            "FEX/build-ios/FEXCore/Source/libFEXCore.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
            "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"
            "FEX/build-ios/External/fmt/libfmt.a"
            "FEX/build-ios/External/cephes/libcephes_128bit.a"
            "FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a"
            "FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a"
            "app/libwineserver.a"
            "app/libntdll_unix.a"
            "app/libwin32u_unix.a"
            "app/libdxmt_combined.a"
            "app/libgnutls.a"
            "app/libhogweed.a"
            "app/libnettle.a"
            "app/libgmp.a"
          )

          for file in "${REQUIRED[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              exit 1
            fi

            echo "OK: $file"
          done

      - name: Verify Xcode project
        run: |
          set -euxo pipefail

          test -d app/Madeira.xcodeproj

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -list

      - name: Build Madeira app
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/MadeiraDerivedData"

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath "$RUNNER_TEMP/MadeiraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Verify Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$RUNNER_TEMP/MadeiraDerivedData/Build/Products/Release-iphoneos/Madeira.app"

          test -d "$APP"
          test -f "$APP/Madeira"

          file "$APP/Madeira"
          lipo -info "$APP/Madeira"

          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP" "$RUNNER_TEMP/Payload/Madeira.app"

          cd "$RUNNER_TEMP"

          /usr/bin/zip \
            -qry \
            "$GITHUB_WORKSPACE/Madeira-unsigned.ipa" \
            Payload

          test -f "$GITHUB_WORKSPACE/Madeira-unsigned.ipa"

      - name: Validate IPA
        shell: bash
        run: |
          set -euxo pipefail

          unzip -t Madeira-unsigned.ipa

          unzip -l Madeira-unsigned.ipa | grep "Payload/Madeira.app/"

          echo
          echo "=============================================="
          echo "SUCCESS"
          echo "=============================================="

          ls -lh Madeira-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-IPA
          path: Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 14