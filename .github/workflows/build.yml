name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            nasm \
            python

      - name: Install LLVM-MinGW
        shell: bash
        run: |
          set -e

          TOOLCHAIN_VERSION="20260421"
          TOOLCHAIN_NAME="llvm-mingw-${TOOLCHAIN_VERSION}-ucrt-macos-universal"

          mkdir -p toolchains
          cd toolchains

          curl -fL \
            -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${TOOLCHAIN_VERSION}/${TOOLCHAIN_NAME}.tar.xz"

          tar -xf llvm-mingw.tar.xz
          rm llvm-mingw.tar.xz

          cd ..

          test -x "toolchains/${TOOLCHAIN_NAME}/bin/x86_64-w64-mingw32-clang"

          echo "LLVM-MinGW installed:"
          "toolchains/${TOOLCHAIN_NAME}/bin/x86_64-w64-mingw32-clang" --version

      - name: Show repository structure
        shell: bash
        run: |
          echo "Build scripts:"
          find build -name "build.sh" -type f -print

          echo ""
          echo "Xcode projects:"
          find . \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -not -path "./.git/*" \
            -print

      - name: Make build scripts executable
        shell: bash
        run: |
          find build -name "build.sh" -type f -exec chmod +x {} \;

      - name: Build Madeira native components
        shell: bash
        run: |
          set -e

          for script in build/*/build.sh; do
            echo "========================================"
            echo "Building $script"
            echo "========================================"

            "$script"
          done

      - name: Find iOS project
        shell: bash
        run: |
          set -e

          PROJECT=$(find . \
            -name "*.xcodeproj" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found: $PROJECT"

      - name: Show Xcode schemes
        shell: bash
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Build iOS app
        shell: bash
        run: |
          set -e

          rm -rf build/DerivedData

          xcodebuild \
            -project "$PROJECT" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find built app
        shell: bash
        run: |
          set -e

          APP=$(find build/DerivedData \
            -path "*/Build/Products/Release-iphoneos/*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced."
            find build/DerivedData -name "*.app" -print
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Found app:"
          echo "$APP"

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf ipa Payload
          mkdir -p Payload ipa

          cp -R "$APP" Payload/

          cd Payload
          zip -r ../ipa/Madeira-unsigned.ipa *.app
          cd ..

          echo "IPA created:"
          ls -lh ipa/Madeira-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: ipa/Madeira-unsigned.ipa
          if-no-files-found: error
