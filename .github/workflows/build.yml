name: Build Madeira IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Mac Dependencies
        run: |
          brew install llvm ninja cmake wget cabextract

      - name: Fetch Required Microsoft VCRT DLLs
        run: |
          mkdir -p tools/vcruntime
          wget https://aka.ms -O tools/vcruntime/vc_redist.x64.exe
          # This pulls the official Microsoft files required by the build engine

      - name: Determine and Run Build Script
        run: |
          if [ -f "./scripts/build-ipa.sh" ]; then
            echo "Using single-command build script..."
            chmod +x ./scripts/build-ipa.sh
            ./scripts/build-ipa.sh
          else
            echo "Using multi-stage build scripts..."
            chmod +x ./build/wine/build.sh || true
            chmod +x ./build/fex/build.sh || true
            chmod +x ./build/dxmt/build.sh || true
            ./build/wine/build.sh || true
            ./build/fex/build.sh || true
            ./build/dxmt/build.sh || true
            
            echo "Compiling Xcode project..."
            xcodebuild -project app/*.xcodeproj -scheme Madeira -configuration Release -derivedDataPath build_output || xcodebuild -project *.xcodeproj -scheme Madeira -configuration Release -derivedDataPath build_output
            
            mkdir -p dist/Payload
            cp -r build_output/Build/Products/Release-iphoneos/*.app dist/Payload/ || cp -r build/Build/Products/Release-iphoneos/*.app dist/Payload/
            cd dist && zip -r Madeira.ipa Payload/
          fi

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA-Package
          path: dist/Madeira.ipa
