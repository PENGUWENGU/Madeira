name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Madeira's native build chain is safer on Intel.
    runs-on: macos-15-intel
    timeout-minutes: 360

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      LLVM_MINGW_VERSION: "20260421"
      LLVM_MINGW_NAME: "llvm-mingw-20260421-ucrt-macos-universal"

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Xcode 16.4 was not found:"
            ls -la /Applications | grep -i Xcode || true
            exit 1
          fi

          xcode-select -s "$DEVELOPER_DIR"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew install \
            cmake \
            ninja \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            nasm \
            python \
            gettext \
            bison \
            flex \
            zip

      - name: Install LLVM-MinGW
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          cd "$GITHUB_WORKSPACE/toolchains"

          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_NAME}.tar.xz"

          curl --fail --location --retry 5 \
            -o llvm-mingw.tar.xz \
            "$URL"

          tar -xf llvm-mingw.tar.xz
          rm llvm-mingw.tar.xz

          TOOLCHAIN="$GITHUB_WORKSPACE/toolchains/$LLVM_MINGW_NAME"

          test -x "$TOOLCHAIN/bin/x86_64-w64-mingw32-clang"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo "LLVM_MINGW_PATH=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "LLVM_MINGW_ROOT=$TOOLCHAIN" >> "$GITHUB_ENV"

          "$TOOLCHAIN/bin/x86_64-w64-mingw32-clang" --version

      - name: Prepare build environment
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$LLVM_MINGW_PATH/bin:$PATH"

          echo "PATH:"
          echo "$PATH"

          echo
          echo "LLVM-MinGW:"
          command -v x86_64-w64-mingw32-clang
          command -v x86_64-w64-mingw32-clang++

          echo
          echo "Repository:"
          git status --short

          echo
          echo "Submodules:"
          git submodule status

      - name: Make build scripts executable
        shell: bash
        run: |
          set -euxo pipefail

          find build -type f -name "build.sh" -exec chmod +x {} \;

      - name: Show build scripts
        shell: bash
        run: |
          set -euxo pipefail

          find build \
            -type f \
            -name "build.sh" \
            -print \
            | sort

      - name: Build Madeira native components
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$LLVM_MINGW_PATH/bin:$PATH"

          for script in $(find build -type f -name "build.sh" | sort); do
            echo
            echo "=============================================="
            echo "BUILDING: $script"
            echo "=============================================="

            "$GITHUB_WORKSPACE/$script"
          done

      - name: Verify native libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking libraries referenced by Madeira..."

          REQUIRED_FILES=(
            "FEX/build-ios/FEXCore/Source/libFEXCore.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
            "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"
            "FEX/build-ios/External/fmt/libfmt.a"
            "FEX/build-ios/External/cephes/libcephes_128bit.a"
            "FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a"
            "FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a"
            "app/libwineserver.a"
            "app/libntdll_unix.a"
            "app/libwin32u_unix.a"
            "app/libdxmt_combined.a"
            "app/libgnutls.a"
            "app/libhogweed.a"
            "app/libnettle.a"
            "app/libgmp.a"
          )

          FAILED=0

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$file" ]; then
              echo "MISSING: $file"
              FAILED=1
            else
              echo "OK: $file"
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "One or more required native libraries are missing."
            echo "Contents of app/:"
            find app -maxdepth 2 -type f | sort || true
            exit 1
          fi

      - name: Show Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          test -d app/Madeira.xcodeproj

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -list

      - name: Build Madeira
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/DerivedData

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Locate Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos/Madeira.app"

          if [ ! -d "$APP" ]; then
            echo "Madeira.app was not produced."

            find "$GITHUB_WORKSPACE/build/DerivedData" \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo
          echo "Found:"
          ls -lah "$APP"

      - name: Verify app architecture
        shell: bash
        run: |
          set -euxo pipefail

          APP_BINARY="$APP/Madeira"

          test -f "$APP_BINARY"

          file "$APP_BINARY"
          lipo -info "$APP_BINARY"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf ipa Payload
          mkdir -p ipa Payload

          cp -R "$APP" Payload/Madeira.app

          (
            cd Payload
            /usr/bin/zip -qry \
              "$GITHUB_WORKSPACE/ipa/Madeira-unsigned.ipa" \
              Madeira.app
          )

          test -f ipa/Madeira-unsigned.ipa

          echo
          echo "IPA:"
          ls -lh ipa/Madeira-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: ipa/Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 14